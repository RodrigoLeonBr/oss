# Web (nginx) do deploy: serve o frontend buildado na :4000 e faz proxy /api -> api:4001.
server {
    listen 4000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip básico (servidor fraco)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API -> container api (preserva o prefixo /api)
    # resolver + variável: DNS resolvido em runtime (embedded DNS do Docker),
    # não no boot — nginx sobe mesmo se a api ainda não respondeu e sobrevive a restart.
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api_upstream api:4001;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SPA: qualquer rota cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
