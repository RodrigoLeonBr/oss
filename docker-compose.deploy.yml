# Deploy em servidor fraco: usa imagem pronta (oss-app:latest), NÃO compila.
# 1. No dev:    scripts/docker-save.ps1        -> gera oss-deploy.tar
# 2. Copie:     oss-deploy.tar + este arquivo + .env  para o servidor
# 3. No server: scripts/deploy-load.sh         -> docker load + up + migrate

services:
  redis:
    image: redis:7-alpine
    container_name: oss_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  app:
    image: oss-app:latest
    container_name: oss_app
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-4001}
      DB_HOST: ${DOCKER_DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-root}
      DB_PASS: ${DB_PASS:-}
      DB_NAME: ${DB_NAME:-oss}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ACCESS_EXPIRATION_MINUTES: ${JWT_ACCESS_EXPIRATION_MINUTES:-60}
      JWT_REFRESH_EXPIRATION_DAYS: ${JWT_REFRESH_EXPIRATION_DAYS:-30}
      LOG_FOLDER: logs/
      LOG_FILE: "%DATE%-app-log.log"
      LOG_LEVEL: ${LOG_LEVEL:-error}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USE_PASSWORD: ${REDIS_USE_PASSWORD:-no}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "${PORT:-4001}:4001"
    volumes:
      - app_logs:/usr/src/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$$PORT/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  redis_data:
  app_logs:
