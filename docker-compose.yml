# Stack desenvolvimento: Redis + API Node (4001) + Vite (4000).
# Acesse o app em http://localhost:4000 — o Vite encaminha /api para o backend.
# MySQL no host (ex.: XAMPP): configure DOCKER_DB_HOST e credenciais no .env.
#
# Produção (uma imagem, API + estático): docker compose -f docker-compose.prod.yml up -d

services:
  redis:
    image: redis:7-alpine
    container_name: oss_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  api:
    build:
      context: .
      dockerfile: Dockerfile.api.dev
    container_name: oss_api
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: development
      PORT: ${API_PORT:-4001}
      DB_HOST: ${DOCKER_DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-root}
      DB_PASS: ${DB_PASS:-}
      DB_NAME: ${DB_NAME:-oss}
      DB_PRODUCAO_HOST: ${DOCKER_DB_HOST:-host.docker.internal}
      DB_PRODUCAO_PORT: ${DB_PRODUCAO_PORT:-3306}
      DB_PRODUCAO_USER: ${DB_PRODUCAO_USER:-hospital}
      DB_PRODUCAO_PASS: ${DB_PRODUCAO_PASS:-}
      DB_PRODUCAO_NAME: ${DB_PRODUCAO_NAME:-producao}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ACCESS_EXPIRATION_MINUTES: ${JWT_ACCESS_EXPIRATION_MINUTES:-60}
      JWT_REFRESH_EXPIRATION_DAYS: ${JWT_REFRESH_EXPIRATION_DAYS:-30}
      LOG_FOLDER: logs/
      LOG_FILE: "%DATE%-app-log.log"
      LOG_LEVEL: ${LOG_LEVEL:-error}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USE_PASSWORD: ${REDIS_USE_PASSWORD:-no}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "${API_PORT:-4001}:${API_PORT:-4001}"
    volumes:
      - api_logs:/usr/src/app/logs
      - ./src:/usr/src/app/src
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$$PORT/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend.dev
    container_name: oss_web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_PROXY_TARGET: http://api:${API_PORT:-4001}
    ports:
      - "${WEB_PORT:-4000}:4000"

volumes:
  redis_data:
  api_logs:
